name: Build and push

on:
  push:
    tags:
      - "*"
        
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build_and_push:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
        # attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: this step is necessary because otherwise the build-push-action can't push /o\
      #       https://github.com/docker/build-push-action/issues/100#issuecomment-715352826
      - uses: docker/setup-buildx-action@v3
        
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false

      - name: Determine Docker Target Stage
        run: |
          # Detect if git tag contains "-dev" to select the development build target
          if [[ "${{ github.ref_name }}" == *"-dev"* ]]; then
            echo "DOCKER_TARGET=development" >> $GITHUB_ENV
          else
            echo "DOCKER_TARGET=production" >> $GITHUB_ENV
          fi

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          target: ${{ env.DOCKER_TARGET }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: push
        run: |
          # NOTE: "tags" is not tags, it's the full docker image path
          IMG="${{ steps.meta.outputs.tags }}"
          docker push "${IMG}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published container image
        run: |
          # Use keyless OIDC-based signing which relies on GitHub ID token provider
          cosign sign --yes "${{ steps.meta.outputs.tags }}"
        env:
          COSIGN_EXPERIMENTAL: "true"